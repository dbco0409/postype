<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>알파타입</title>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="./css/write.css" />
<link rel="stylesheet" href="./css/style.css" />

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

<script src="js/script.js"></script>
<script src="js/bo_create.js"></script>
</head>
<body>
<div id="wrap">

<header id="st-head">
	<h2 class="tit">새 게시판 만들기</h2>
	<button type="button" class="btn user-menu" onclick="menuToggle()">
		<img src="./image/common/default_profile.png"/>
	</button>
</header>
<nav class="user-menu-toggle">
	<div class="m-bg" onclick="hideUserMenu()"></div>
	<div class="nabar-scroll">
		<div class="group">
			<button type="button" class="btn btn-nabar btn-dropdown" onclick="navToggle()">
				<img src="./image/common/default_profile.png" class="n-img"/>
				<h4 class="menu-txt">홍길동</h4>
				<i class="fas fa-chevron-down ico-dropdown ico-right"></i>
			</button>
		</div>
		<div class="toggle-down">
			<div class="group">
				<button type="button" class="btn btn-nabar">
					<i class="far fa-star n-ico"></i>
					<h4 class="menu-txt">길동이네</h4>
					<div class="ico-right">
						<a class="is"><i class="fas fa-cog"></i></a>
						<a><i class="fas fa-plus"></i></a>
					</div>
				</button>
			</div>
			<div class="group">
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-home n-ico"></i>
					<h4 class="menu-txt">알파타입 홈</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-bell n-ico"></i>
					<h4 class="menu-txt">알림</h4>
					<em class="bedge bell-bedge ico-right">2</em>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="far fa-user n-ico"></i>
					<h4 class="menu-txt">구독</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-inbox n-ico"></i>
					<h4 class="menu-txt">보관함</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-envelope n-ico"></i>
					<h4 class="menu-txt">메시지</h4>
				</button>
			</div>
			<div class="group">
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-comment-dollar n-ico"></i>
					<h4 class="menu-txt">수익</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fab fa-product-hunt n-ico"></i>
					<h4 class="menu-txt">포인트</h4>
					<span class="btn-point ico-right">충전</span>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fab fa-mastodon n-ico"></i>
					<h4 class="menu-txt">가입한 멤버십</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-shopping-basket n-ico"></i>
					<h4 class="menu-txt">스토어 주문</h4>
				</button>
			</div>
			<div class="group">
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-cog n-ico"></i>
					<h4 class="menu-txt">설정</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="far fa-plus-square n-ico"></i>
					<h4 class="menu-txt">새 채널 만들기</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-book n-ico"></i>
					<h4 class="menu-txt">크리에이터 가이드</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="far fa-question-circle n-ico"></i>
					<h4 class="menu-txt">도움 센터</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-sign-out-alt n-ico"></i>
					<h4 class="menu-txt">로그아웃</h4>
				</button>
			</div>
		</div>
		<div class="toggle-up">
			<h6>내 프로필</h6>
			<div class="group">
				<button type="button" class="btn btn-nabar">
					<img src="./image/common/default_profile.png" class="n-img"/>
					<h4 class="menu-txt">홍길동</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-user-plus n-ico"></i>
					<h4 class="menu-txt">새 프로필 만들기</h4>
				</button>
				<button type="button" class="btn btn-nabar">
					<i class="fas fa-user-edit n-ico"></i>
					<h4 class="menu-txt">프로필 수정</h4>
				</button>
			</div>
		</div>
	</div>
</nav>

<aside id="st-menu">
	<div class="fixedbg"></div>
	<div class="inner">
		<div class="st-logo bor">
			<a class="ap-logo">ALP<span>HATYPE</span></a>
		</div>
		<div class="st-h bor">
			<button type="button" class="btn btn-ch">
				<img src="./image/common/default_profile.png" class="n-img"/>
				<h3>알파플러스 채널</h3>
			</button>
			<div class="btns">
				<button type="button" class="btn btn-primary btn-write"><i class="fas fa-plus"></i><h3>새 포스트 쓰기</h3></button>
			</div>
		</div>
		<div class="st-b ">
			<button type="button" class="btn btn-nabar">
				<i class="fas fa-columns"></i>
				<h3>대시보드</h3>
			</button>
			<button type="button" class="btn btn-nabar">
				<i class="far fa-clone"></i>
				<h3>포스트</h3>
			</button>
			<button type="button" class="btn btn-nabar">
				<i class="fas fa-book"></i>
				<h3>시리즈</h3>
			</button>
			<button type="button" class="btn btn-nabar">
				<i class="fas fa-chart-bar"></i>
				<h3>통계</h3>
			</button>
			<button type="button" class="btn btn-nabar btn-active">
				<i class="fas fa-user-plus n-ico"></i>
				<h3>커뮤니티</h3>
			</button>
			<button type="button" class="btn btn-nabar">
				<i class="fas fa-shopping-basket"></i>
				<h3>스토어</h3>
				<span class="beta">베타</span>
			</button>
			<button type="button" class="btn btn-nabar">
				<i class="fab fa-mastodon"></i>
				<h3>멤버십</h3>
			</button>
			<button type="button" class="btn btn-nabar">
				<i class="far fa-user n-ico"></i>
				<h3>구독자</h3>
			</button>
			<button type="button" class="btn btn-nabar">
				<i class="fas fa-cog n-ico"></i>
				<h3>설정</h3>
			</button>
		</div>
	</div>
</aside>
<nav id="m_menu">
	<button type="button" class="btn btn-nabar btn-active">
		<i class="fas fa-columns"></i>
		<h3>대시보드</h3>
	</button>
	<button type="button" class="btn btn-nabar">
		<i class="far fa-clone"></i>
		<h3>포스트</h3>
	</button>
	<button type="button" class="btn btn-nabar">
		<i class="fas fa-chart-bar"></i>
		<h3>통계</h3>
	</button>
	<button type="button" class="btn btn-nabar">
		<i class="fas fa-shopping-basket"></i>
		<h3>스토어</h3>
	</button>
	<button type="button" class="btn btn-nabar btn-menu">
		<i class="fas fa-bars"></i>
		<h3>모바일메뉴</h3>
	</button>
</nav>

<form>
<section class="ch-write se-write sb-write" id="sb-write">
	<div class="inner">
		<div class="form-set">
			<div class="input-group group">
				<label for="title">제목<span class="star">*</span></label>
				<div class="input"><input type="text" id="title" placeholder="제목을 입력해주세요." class="form-control input-txt"/></div>
				<p class="desc">최대 10자까지 입력할 수 있어요.</p>
			</div>
			<div class="input-group group">
				<label for="wlevel">쓰기 권한<span class="star">*</span></label>
				<div class="selectGroup">
					<button type="button" class="btn btn-selected input-control" id="selectButton">로그인 이용자</button>
					<div class="opt" id="options">
						<a>로그인 이용자</a>
						<a>멤버십 가입자</a>
						<a>채널소유자 및 팀원</a>
						<a>구독자</a>
					</div>
				</div>
				<p class="desc"><span class="red">주의사항</span> 권한이 사라지면 더 이상 게시글을 작성할 수 없고, 기존에 작성한 게시글은 삭제만 할 수 있어요.</p>
			</div>
		</div>
	</div>
	<div class="btns mode-w">
		<button type="button" class="btn btn-primary" onclick="validateForm()">게시판 만들기</button>
	</div>
</section>
</form>

<div class="modal fade" id="registerModal" tabindex="-1" role="dialog" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">알림</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div id="modal-alert-message">이메일 주소를 정확히 입력해주세요.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-dismiss="modal">확인</button>
      </div>
    </div>
  </div>
</div>

</div>
</body>
</html>
