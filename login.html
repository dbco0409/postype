<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>알파타입</title>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="./css/login.css" />
<script src="js/script.js"></script>
</head>
<body>
<div id="wrap">
<header class="header noline">
	<nav class="navbar">
		<div class="inner">
			<div class="nav-menu">
				<a class="ap-logo">ALPHATYPE</a>
			</div>
			<div class="nav-info">
				<a href="register.html" class="btn btn-register btn-outline-primary">회원가입</a>
			</div>
		</div>
	</nav>
</header>

<section class="login">
	<div class="login-wrap">
		<h1>알파타입 로그인</h1>
		<p class="msg-pc">포스타입에 돌아오신 것을 환영해요!</p>
		<p class="msg-m">계정이 없으세요? <a href="register.html">회원가입</a></p>
		<div class="login-btns">
			<button type="button" class="login-btn google">
				<i class="sns-google"></i><span class="txt">구글로 로그인</span>
			</button> 
			<button type="button" class="login-btn naver">
				<i class="sns-naver"></i><span class="txt">네이버로 로그인</span>
			</button> 
			<button type="button" class="login-btn mail" onclick="location.href='login_mail.html'">
				<i class="fas fa-envelope"></i><span class="txt">이메일로 로그인</span>
			</button> 
		</div>
		<div class="login-check">
			<label class="custom-checkbox">
				<input type="checkbox"/>
				<span class="checkmark"></span>
				로그인 상태 유지
		  </label>
		</div>
		<div class="register-menu">
			<a href="findid.html">계정 찾기</a>
			<span>·</span>
			<a href="register.html">회원가입</a>
		</div>
		<div class="sns-txt">
			SNS로 로그인 및 회원가입 시 알파타입의 <a href="#">이용약관</a>과 <a href="#">개인정보 수집 및 이용</a>에 동의한 것으로 간주합니다.
		</div>
	</div>
</section>

</div>
</body>
</html>
