<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>알파타입</title>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="./css/login.css" />

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

<script src="js/script.js"></script>
</head>
<body>
<div id="wrap">
<header class="header noline">
	<nav class="navbar">
		<div class="inner">
			<div class="nav-menu">
				<a class="ap-logo">ALPHATYPE</a>
			</div>
			<div class="nav-info">
				<a href="register.html" class="btn btn-register btn-outline-primary">회원가입</a>
			</div>
		</div>
	</nav>
</header>

<section class="login">
	<div class="login-wrap">
		<h1>이메일로 로그인</h1>
		<div class="login-frm">
			<form id="login-form">
				<input type="email" id="email" class="input-txt" placeholder="이메일"/>
				<input type="password" id="pwd" class="input-txt" placeholder="비밀번호"/>
				<button type="button" class="btn btn-primary btn-login" onclick="validateForm()">로그인</button>
			</form>
		</div>
		<div class="register-menu">
			<a href="findid.html">계정 찾기</a>
		</div>
		<div class="back-btn">
			<a href="login.html"><i class="fas fa-chevron-left"></i> 뒤로</a>
		</div>
	</div>
</section>

<div class="modal fade" id="registerModal" tabindex="-1" role="dialog" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">알림</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div id="modal-alert-message">이메일 주소를 정확히 입력해주세요.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">확인</button>
      </div>
    </div>
  </div>
</div>

<script>
function validateForm() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pwd').value.trim();

  let message = '';
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!email) {
    message = '이메일 입력을 해주세요.';
  } else if (!emailPattern.test(email)) {
    message = '이메일 형식에 맞게 입력해주세요.';
  } else if (!password) {
    message = '비밀번호를 입력해주세요.';
  } 

  if (message) {
    document.getElementById('modal-alert-message').textContent = message;
    $('#registerModal').modal('show');
  } else {
    document.getElementById('registration-form').submit();
  }
}
</script>

</div>
</body>
</html>
