<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>알파타입</title>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="./css/login.css" />
<script src="js/script.js"></script>
</head>
<body>
<div id="wrap">
<header class="header noline">
	<nav class="navbar">
		<div class="inner">
			<div class="nav-menu">
				<a class="ap-logo">ALPHATYPE</a>
			</div>
			<div class="nav-info">
				<a href="register.html" class="btn btn-register btn-outline-primary">회원가입</a>
			</div>
		</div>
	</nav>
</header>

<section class="login">
	<div class="login-wrap">
		<h1>알파타입 회원가입</h1>
		<p class="mb-10">창작 커뮤니티 알파타입에서는 누구나 창작물로 수익을 얻을 수 있어요. 팬들은 좋아하는 크리에이터를 구독하고 후원할 수도 있죠. 지금 바로 시작해보세요!</p>
		<div class="login-check mt-10">
			<label class="custom-checkbox strong">
				<input type="checkbox" id="age-check" value="1"/>
				<span class="checkmark"></span>
				만 14세 이상입니다.
		  </label>
		  <span id="warning-txt" class="warnning-txt">알파타입에 가입하려면 만 14세 이상이어야 해요.</span>
		</div>
		<div class="login-btns">
			<button type="button" class="login-btn google">
				<i class="sns-google"></i><span class="txt">구글로 회원가입</span>
			</button> 
			<button type="button" class="login-btn naver">
				<i class="sns-naver"></i><span class="txt">네이버로 회원가입</span>
			</button> 
			<button type="button" class="login-btn mail" onclick="handleRegister()">
				<i class="fas fa-envelope"></i><span class="txt">이메일로 회원가입</span>
			</button> 
		</div>
		<p class="mt-12">이미 계정이 있으세요? <a href="login.html">로그인</a></p>
		<div class="register-menu">
			<a href="findid.html">계정 찾기</a>
		</div>
		<div class="sns-txt">
			SNS로 로그인 및 회원가입 시 알파타입의 <a href="#">이용약관</a>과 <a href="#">개인정보 수집 및 이용</a>에 동의한 것으로 간주합니다.
		</div>
	</div>
</section>

<script>
function handleRegister() {
  const checkbox = document.getElementById('age-check');
  const warningTxt = document.getElementById('warning-txt');
  
  if (checkbox.checked) {
    // 체크박스가 체크되어 있으면 페이지 이동
    window.location.href = 'register-email.html';
  } else {
    // 체크박스가 체크되어 있지 않으면 경고 메시지 표시
    warningTxt.style.display = 'block';
  }
}

document.getElementById('age-check').addEventListener('change', function() {
  const warningTxt = document.getElementById('warning-txt');
  if (this.checked) {
    warningTxt.style.display = 'none'; // 체크 시 경고 메시지 숨김
  } else {
    warningTxt.style.display = 'block'; // 체크 해제 시 경고 메시지 표시
  }
});
</script>
</div>
</body>
</html>
